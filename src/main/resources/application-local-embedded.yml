spring:
  datasource:
    url: jdbc:h2:mem:payshield_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  kafka:
    listener:
      auto-startup: false

payshield:
  environment-label: local-embedded
  security:
    demo-seed-enabled: true
