spring.application.name=backend
server.port=${PORT:8080}

# PostgreSQL + pgvector
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/devpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Frontend & CORS
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Token encryption (salt must be valid hex for Spring Security Encryptors.text)
app.token-encryptor-password=${APP_TOKEN_ENCRYPTOR_PASSWORD:devpilot-local-token-secret-2026}
app.token-encryptor-salt=${APP_TOKEN_ENCRYPTOR_SALT:7f7c15b8d7a340c2}

# GitHub API rate limit & Indexing settings
app.github.api-delay-ms=${APP_GITHUB_API_DELAY_MS:50}
app.indexing.chunk-size=${APP_INDEXING_CHUNK_SIZE:800}
app.indexing.max-file-bytes=${APP_INDEXING_MAX_FILE_BYTES:102400}

# GitHub OAuth2 Client
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liGQugTWEYI7HCno}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,repo

# Spring AI (OpenAI / OpenRouter compatible) + PGVector
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:sk-placeholder-configure-in-env}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.embedding.options.model=${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
