<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">PayShield AI — Intelligent Payments. Explainable Risk. Reliable Ledger.</title>
  <desc id="bannerDesc">Architecture banner for PayShield AI: Java 21, Spring Boot 3, PostgreSQL ACID Double-Entry Ledger, Redis 7 Lua ZSET, OpenSearch 8-D k-NN, Kafka KRaft Outbox, and RAG Dispute Copilot.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07192E"/>
      <stop offset="55%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#0F345B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2684FF"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E3A5F" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Subtle Right-Side Architectural Nodes -->
  <g transform="translate(830, 48)" opacity="0.92">
    <rect x="0" y="0" width="315" height="224" rx="12" fill="#0B1F38" stroke="#1E4976" stroke-width="1.2"/>
    <text x="20" y="28" fill="#64B5F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.2">LIVE LEDGER &amp; RISK PIPELINE</text>
    <line x1="20" y1="40" x2="295" y2="40" stroke="#1E3A5F" stroke-width="1"/>

    <!-- Pipeline Rows -->
    <circle cx="30" cy="66" r="5" fill="#10B981"/>
    <text x="46" y="70" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">ACID Double-Entry</text>
    <text x="220" y="70" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">NUMERIC(19,4)</text>

    <circle cx="30" cy="100" r="5" fill="#3B82F6"/>
    <text x="46" y="104" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Velocity ZSET</text>
    <text x="220" y="104" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">&lt;= 5 / 60s Lua</text>

    <circle cx="30" cy="134" r="5" fill="#F59E0B"/>
    <text x="46" y="138" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Vector k-NN</text>
    <text x="220" y="138" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">8-D Cosine</text>

    <circle cx="30" cy="168" r="5" fill="#8B5CF6"/>
    <text x="46" y="172" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Kafka Outbox</text>
    <text x="220" y="172" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">KRaft + DLT</text>

    <circle cx="30" cy="202" r="5" fill="#06B6D4"/>
    <text x="46" y="206" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">RAG Copilot</text>
    <text x="220" y="206" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">SHA-256 6h</text>
  </g>

  <!-- Shield Emblem -->
  <g transform="translate(56, 62)">
    <path d="M40 4 L76 18 V48 C76 74 59 95 40 104 C21 95 4 74 4 48 V18 Z" fill="url(#shieldGrad)" stroke="#60A5FA" stroke-width="1.8"/>
    <path d="M27 53 L36 62 L55 41" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Tagline -->
  <text x="154" y="106" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">PayShield AI</text>
  <text x="156" y="140" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600">Intelligent Payments. Explainable Risk. Reliable Ledger.</text>
  <text x="156" y="178" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5">Full-stack FinTech payment simulator with ACID double-entry accounting, Redis Lua velocity controls,</text>
  <text x="156" y="200" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5">OpenSearch 8-D behavioral k-NN scoring, Kafka transactional outbox, and PII-redacted RAG dispute audits.</text>

  <!-- Bottom Architecture Pills -->
  <g transform="translate(56, 240)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="128" height="30" rx="6" fill="#102C4C" stroke="#2563EB" stroke-width="1"/>
    <text x="64" y="19" fill="#DBEAFE" text-anchor="middle">Java 21 + Boot 3</text>

    <rect x="140" y="0" width="136" height="30" rx="6" fill="#102C4C" stroke="#2563EB" stroke-width="1"/>
    <text x="208" y="19" fill="#DBEAFE" text-anchor="middle">PostgreSQL 16</text>

    <rect x="288" y="0" width="126" height="30" rx="6" fill="#102C4C" stroke="#2563EB" stroke-width="1"/>
    <text x="351" y="19" fill="#DBEAFE" text-anchor="middle">Redis 7 ZSET</text>

    <rect x="426" y="0" width="144" height="30" rx="6" fill="#102C4C" stroke="#2563EB" stroke-width="1"/>
    <text x="498" y="19" fill="#DBEAFE" text-anchor="middle">Kafka 3.7 KRaft</text>

    <rect x="582" y="0" width="154" height="30" rx="6" fill="#102C4C" stroke="#2563EB" stroke-width="1"/>
    <text x="659" y="19" fill="#DBEAFE" text-anchor="middle">OpenSearch 2.12</text>
  </g>
</svg>
