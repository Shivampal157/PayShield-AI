<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="100%" height="auto" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">PayShield — Distributed Payment Ledger, Real-Time Vector Risk &amp; Dispute Engine</title>
  <desc id="bannerDesc">System architecture header for PayShield: Java 21 Virtual Threads, Spring Boot 3.3, PostgreSQL 16 ACID NUMERIC(19,4) + SHA-256 Hash-Chained Ledger, Redis 7 ZSET Lua Velocity, OpenSearch 2.12 8-D k-NN, and Apache Kafka 3.7 KRaft Transactional Outbox.</desc>
  <defs>
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1B"/>
      <stop offset="55%" stop-color="#09192E"/>
      <stop offset="100%" stop-color="#0D2442"/>
    </linearGradient>
    <linearGradient id="emblemFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0052CC"/>
    </linearGradient>
    <pattern id="techGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E3A5F" stroke-width="0.6" stroke-opacity="0.38"/>
    </pattern>
  </defs>

  <!-- Outer Frame -->
  <rect width="1200" height="330" rx="14" fill="url(#canvasBg)"/>
  <rect width="1200" height="330" rx="14" fill="url(#techGrid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="13" fill="none" stroke="#1E3A5F" stroke-width="1.2"/>

  <!-- Top Engineering Classification Strip -->
  <g transform="translate(52, 34)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">
    <rect x="0" y="-14" width="10" height="10" rx="2" fill="#10B981"/>
    <text x="18" y="-5" fill="#94A3B8" font-weight="600">FINTECH CORE SYSTEMS ARCHITECTURE  //  JAVA 21 LTS · SPRING BOOT 3.3 · FLYWAY V2</text>
  </g>

  <!-- Precision Geometric Shield Emblem -->
  <g transform="translate(52, 64)">
    <rect x="0" y="0" width="76" height="76" rx="16" fill="#0B1F3A" stroke="#2563EB" stroke-width="1.4"/>
    <path d="M38 13 L61 22 V39 C61 54 51 64 38 69 C25 64 15 54 15 39 V22 Z" fill="url(#emblemFill)" stroke="#60A5FA" stroke-width="1.4"/>
    <path d="M28 39 L35 46 L49 31" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Primary Heading & Technical Subtitle -->
  <text x="148" y="102" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-1">PayShield AI</text>
  <rect x="418" y="76" width="126" height="24" rx="5" fill="#0F294A" stroke="#1D4ED8" stroke-width="1"/>
  <text x="481" y="92" fill="#93C5FD" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">RELEASE v1.0.0</text>

  <text x="148" y="132" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="17.5" font-weight="600">
    ACID Double-Entry Payment Ledger, SHA-256 Journal Hash-Chain &amp; Real-Time Vector Risk Engine
  </text>

  <text x="148" y="166" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14">
    Deadlock-free pessimistic wallet locking, payload-verified idempotency, Redis 7 Lua sliding-window velocity controls,
  </text>
  <text x="148" y="187" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="14">
    OpenSearch 8-D HNSW behavioral similarity, Kafka 3.7 transactional outbox, and policy-grounded dispute investigation.
  </text>

  <!-- Bottom Technical Specification Chips -->
  <g transform="translate(52, 232)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">
    <rect x="0" y="0" width="150" height="58" rx="8" fill="#09192C" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="14" y="22" fill="#64748B" font-size="9.5">LEDGER PRECISION</text>
    <text x="14" y="42" fill="#E2E8F0" font-size="12">NUMERIC(19, 4)</text>

    <rect x="162" y="0" width="166" height="58" rx="8" fill="#09192C" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="176" y="22" fill="#64748B" font-size="9.5">TAMPER EVIDENCE</text>
    <text x="176" y="42" fill="#10B981" font-size="12">SHA-256 Hash Chain</text>

    <rect x="340" y="0" width="164" height="58" rx="8" fill="#09192C" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="354" y="22" fill="#64748B" font-size="9.5">CONCURRENCY MODEL</text>
    <text x="354" y="42" fill="#E2E8F0" font-size="12">UUID FOR UPDATE</text>

    <rect x="516" y="0" width="154" height="58" rx="8" fill="#09192C" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="530" y="22" fill="#64748B" font-size="9.5">VELOCITY ENGINE</text>
    <text x="530" y="42" fill="#60A5FA" font-size="12">Redis ZSET + Lua</text>

    <rect x="682" y="0" width="154" height="58" rx="8" fill="#09192C" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="696" y="22" fill="#64748B" font-size="9.5">EVENT DURABILITY</text>
    <text x="696" y="42" fill="#E2E8F0" font-size="12">KRaft Outbox + DLT</text>
  </g>

  <!-- Right-Side Deterministic Execution Telemetry Schematic -->
  <g transform="translate(866, 36)">
    <rect x="0" y="0" width="286" height="254" rx="10" fill="#081627" stroke="#1E3A5F" stroke-width="1.2"/>
    <text x="18" y="26" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1">TRANSACTION EXECUTION PATH</text>
    <line x1="18" y1="36" x2="268" y2="36" stroke="#1E3A5F" stroke-width="1"/>

    <!-- Vertical Connector Line -->
    <line x1="27" y1="58" x2="27" y2="226" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="3 3"/>

    <circle cx="27" cy="58" r="4.5" fill="#3B82F6"/>
    <text x="42" y="62" fill="#F1F5F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">1. Idempotency + SHA-256</text>
    <text x="42" y="76" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">SETNX fast-path + DB UNIQUE</text>

    <circle cx="27" cy="100" r="4.5" fill="#10B981"/>
    <text x="42" y="104" fill="#F1F5F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">2. Ordered Row Locking</text>
    <text x="42" y="118" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">SELECT ... FOR UPDATE (UUID)</text>

    <circle cx="27" cy="142" r="4.5" fill="#F59E0B"/>
    <text x="42" y="146" fill="#F1F5F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">3. Lua ZSET &amp; 8-D HNSW</text>
    <text x="42" y="160" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">60s window + Cosine [0, 0.99]</text>

    <circle cx="27" cy="184" r="4.5" fill="#38BDF8"/>
    <text x="42" y="188" fill="#F1F5F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">4. Hash-Chained Journal</text>
    <text x="42" y="202" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">DEBIT/CREDIT + prev_hash link</text>

    <circle cx="27" cy="226" r="4.5" fill="#A78BFA"/>
    <text x="42" y="230" fill="#F1F5F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">5. ACID Outbox Relay</text>
    <text x="42" y="244" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">Kafka KRaft + Idempotent Ack</text>
  </g>
</svg>
