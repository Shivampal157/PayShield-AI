services:
  - type: web
    name: payshield-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local-embedded
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: VIRTUAL_THREADS_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: OFFLINE
      - key: APP_COOKIE_SECURE
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -Xmx280m -Xms128m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Xss256k -Djava.security.egd=file:/dev/./urandom"

