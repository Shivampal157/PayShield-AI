services:
  - type: web
    name: payshield-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: local-embedded
      - key: DEMO_SEED_ENABLED
        value: "true"
      - key: VIRTUAL_THREADS_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: OFFLINE
      - key: APP_COOKIE_SECURE
        value: "true"
